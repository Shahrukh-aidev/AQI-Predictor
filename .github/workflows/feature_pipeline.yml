name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hopsworks.txt

      - name: Verify environment
        run: |
          python --version
          python -c "import pandas, numpy, pyarrow, hopsworks; print('Environment OK')"

      - name: Run hourly feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_FEATURE_GROUP_VERSION: "6"
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python -m src.pipelines.feature_pipeline

      - name: Confirm completion
        run: |
          echo "Hourly feature pipeline completed at $(date -u)"