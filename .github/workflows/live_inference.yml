name: Live AQI Inference

on:
  workflow_dispatch:

  schedule:
    - cron: "5 * * * *"

jobs:
  live-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install pinned inference dependencies
        run: |
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.9.0 \
            joblib==1.5.3 \
            requests==2.34.2 \
            python-dotenv==1.2.2

      - name: Install Hopsworks
        run: |
          pip install hopsworks==5.0.3

      - name: Verify environment
        run: |
          python --version
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import hopsworks; print('Hopsworks:', hopsworks.__version__)"

      - name: Download production models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python -m src.models.download_production_models

      - name: Run live AQI inference
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python -m src.models.live_predictor

      - name: Display predictions
        run: |
          echo "===== predictions/latest.json ====="
          cat predictions/latest.json