name: Live AQI Inference

on:
  workflow_dispatch:

  schedule:
    # Every hour at 5 minutes past the hour
    - cron: "5 * * * *"

# Required so GitHub Actions can commit the latest prediction JSON.
permissions:
  contents: write

jobs:
  live-inference:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # Upgrade packaging tools
      # ------------------------------------------------------

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # ------------------------------------------------------
      # Core inference dependencies
      # ------------------------------------------------------

      - name: Install core inference dependencies
        run: |
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.9.0 \
            joblib==1.5.3 \
            requests==2.34.2 \
            python-dotenv==1.2.2

      # ------------------------------------------------------
      # Hopsworks
      # ------------------------------------------------------

      - name: Install Hopsworks Python client
        run: |
          pip install "hopsworks[python]==5.0.3"

      # ------------------------------------------------------
      # Verify environment
      # ------------------------------------------------------

      - name: Verify environment
        run: |
          python --version
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import pyarrow; print('PyArrow:', pyarrow.__version__)"
          python -c "import hopsworks; print('Hopsworks:', hopsworks.__version__)"

      - name: Verify Hopsworks Python engine
        run: |
          python -c "import hsfs; print('HSFS import: OK')"

      # ------------------------------------------------------
      # Download newest production models
      # ------------------------------------------------------

      - name: Download production models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python -m src.models.download_production_models

      # ------------------------------------------------------
      # Run live inference
      # ------------------------------------------------------

      - name: Run live AQI inference
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python -m src.models.live_predictor

      # ------------------------------------------------------
      # Show prediction output
      # ------------------------------------------------------

      - name: Display prediction output
        run: |
          echo "===== predictions/latest.json ====="
          cat predictions/latest.json

      # ------------------------------------------------------
      # Publish latest predictions back to GitHub
      # ------------------------------------------------------

      - name: Commit latest predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add predictions/latest.json

          if git diff --cached --quiet; then
            echo "No prediction changes to commit."
          else
            git commit -m "Update live AQI predictions"
            git push
          fi