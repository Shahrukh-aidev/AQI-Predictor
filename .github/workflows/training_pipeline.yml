name: Daily Training Pipeline

on:
  schedule:
    # Runs every day at 02:00 UTC
    # After the hourly feature pipeline has fresh data
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  training:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hopsworks.txt
          pip install scikit-learn joblib numpy

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_FEATURE_GROUP_VERSION: "6"
        run: |
          python -m src.pipelines.training_pipeline

      - name: Upload metrics report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-metrics
          path: models/training_metrics.json
          retention-days: 30

      - name: Confirm completion
        run: echo "Training pipeline finished at $(date -u)"