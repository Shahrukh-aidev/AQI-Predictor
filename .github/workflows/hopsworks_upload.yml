name: Upload AQI Features to Hopsworks

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hopsworks.txt

      - name: Verify environment
        run: |
          python --version
          python -c "
          import hopsworks, pandas, numpy
          print('hopsworks:', hopsworks.__version__)
          print('pandas:   ', pandas.__version__)
          print('numpy:    ', numpy.__version__)
          "

      - name: Check training data
        run: |
          ls -lh data/processed/training_data.parquet
          python -c "
          import pandas as pd
          df = pd.read_parquet('data/processed/training_data.parquet')
          print('Rows:   ', len(df))
          print('Columns:', len(df.columns))
          print(df.columns.tolist())
          "

      - name: Upload features to Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_FEATURE_GROUP_VERSION: "6"
        run: |
          python -m src.features.hopsworks_upload
