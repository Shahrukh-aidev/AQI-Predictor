name: Upload Features to Hopsworks

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install hopsworks deltalake python-dotenv pyarrow pandas numpy

      - name: Upload to Hopsworks
        run: python -m src.features.hopsworks_upload
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}name: Upload Features to Hopsworks

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            hopsworks==5.0.3 \
            hsfs==5.0.3 \
            deltalake==1.6.2 \
            python-dotenv \
            pyarrow \
            pandas \
            numpy

      - name: Verify environment
        run: |
          python --version
          python -c "import hopsworks, hsfs, deltalake; print('hopsworks:', hopsworks.__version__); print('hsfs:', hsfs.__version__); print('deltalake:', deltalake.__version__)"

      - name: Upload features to Hopsworks
        run: python -m src.features.hopsworks_upload
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}