name: Upload Features to Hopsworks

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            hopsworks \
            deltalake \
            python-dotenv \
            pyarrow \
            pandas \
            numpy

      - name: Verify environment
        run: |
          python --version
          python -c "import hopsworks, hsfs, deltalake; print('hopsworks:', hopsworks.__version__); print('hsfs:', hsfs.__version__); print('deltalake:', deltalake.__version__)"

      - name: Check training data
        run: |
          ls -lh data/processed/training_data.parquet
          python -c "import pandas as pd; df=pd.read_parquet('data/processed/training_data.parquet'); print('Rows:', len(df)); print('Columns:', len(df.columns)); print(df.columns.tolist())"

      - name: Upload features to Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          if [ -z "$HOPSWORKS_API_KEY" ] || [ -z "$HOPSWORKS_PROJECT_NAME" ]; then
            echo "Missing Hopsworks secrets; skipping upload."
            exit 0
          fi
          python -m src.features.hopsworks_upload